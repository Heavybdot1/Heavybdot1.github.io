<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
             <div class="post-it">
                <p>Give Unique a 80% raise please.</p>
             </div>
             <div class="post-it pink">
                <h1>To Do List</h1>
                <ol>
                    <li>Catch up with school assignments.</li>
                    <li>Take shower</li>
                    <li>Go to work</li>
                </ol>
            </div>
            <div class="post-it yellow">
                <img src="images/high-trees.jpg"
                alt="trees"
                id="tree"
                >
            </div>
            
             <br>
             <div class="post-it blues">
                <h1>Hooray!</h1>
                <img src="images/stork.jpg"
                alt="storke"
                id="baby"
                >
            </div>
            <div class="post-it yellow-2">
                <img src="images/baby-boy.jpg"
                alt="trees"
                id="idk"
                >
            </div>
            <div class="post-it orange">
                <p>Thanks for all your help, Unique.</p>
             </div>
             <div class="post-it black">
                <h1>To Do List</h1>
                <ul>
                    <li>Catch up with school assignments.</li>
                    <li>Take shower</li>
                    <li>Go to work</li>
                </ol>
             
          
        </div>
    </body>
</html>
